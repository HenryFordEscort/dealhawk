name: Wyswietlenia

# CODZIENNIE, 200 OFERT. Darmowy limit Cloudflare to 10 minut czasu
# przegladarki na dobe, a oferta czyta sie w okolo 3 sekundy - 200 ofert to
# caly limit i ani sekundy ponad. Tygodniowo wychodzi 1400 ofert zamiast 150,
# swieze ogloszenia sa lapane w ciagu doby od wystawienia, a cala polka
# 8 tys.+ obraca sie w okolo trzy tygodnie.
#
# Runner NIE CHODZI po OLX-ie - robi to za niego Cloudflare. OLX blokuje
# serwerownie GitHuba (zmierzone 16.11.2026: 45 prob, 45 odpowiedzi HTTP 403),
# natomiast adresy Cloudflare wpuszcza, bo przez nie chodzi caly ten bot.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      probka:
        description: "Ile ofert odpytac w tym biegu"
        default: "200"

permissions:
  contents: write

concurrency:
  group: wyswietlenia
  cancel-in-progress: false

jobs:
  zbierz:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zaleznosci
        run: pip install -q requests

      - name: Zbierz wyswietlenia
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          PROBKA: ${{ inputs.probka || '200' }}
        run: python3 wyswietlenia.py

      - name: Zapisz dziennik
        if: always()
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          git add wyswietlenia.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "wyswietlenia: dzienna probka"
          # Jawna baza zamiast `git pull --rebase`: na plytkim klonie gole pull
          # prosi o historie, ktorej ten klon nie ma, i git wisi kilkanascie minut.
          for i in 1 2; do
            BAZA=$(git rev-parse refs/remotes/origin/main) || exit 1
            if timeout -k 5 15 git fetch --depth=1 origin main \
               && timeout -k 5 15 git rebase --onto FETCH_HEAD "$BAZA" \
               && timeout -k 5 15 git push origin HEAD:main; then
              echo "dziennik zapisany (próba $i)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "próba $i nie wyszła"
            sleep 5
          done
          # CZERWONO, NIE PO CICHU: probka, ktora nie trafila do dziennika,
          # przepada - licznika sprzed doby nikt juz nie odczyta.
          echo "::error::Nie udalo sie zapisac dziennika wyswietlen"
          exit 1
