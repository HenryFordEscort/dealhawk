name: DealHawk

# Tempo nadaje PĘTLA WEWNĄTRZ BIEGU, nie harmonogram. Powód (zmierzone 23.08
# na 204 biegach): GitHub nie dowozi crona co do minuty — odstęp między skanami
# miał medianę 5,0 min, ale p90 = 10,4 min i maksimum 25 min. Ten ogon szedł
# wprost w czas powiadomienia: wiek ogłoszenia w chwili wykrycia miał medianę
# 4 min i p90 = 14 min.
#
# Bieg żyje więc 8 minut i skanuje półki sam, w tempie adaptacyjnym
# (TEMPO_* w tracker.py): coraz gęściej, dopóki serwis to znosi, a po
# podstawionej stronie natychmiast z powrotem na 300 s. Sufit = dzisiejsze
# tempo, więc najgorszy przypadek to stan sprzed tej zmiany.
#
# Bieg trwa dłużej niż odstęp wyzwalacza i to jest zamierzone: przy
# cancel-in-progress: false wyzwolenie czeka w kolejce (GitHub trzyma najwyżej
# jeden bieg oczekujący) i rusza zaraz po naszym, więc kanał nie zostaje bez
# opieki nawet wtedy, gdy harmonogram przepuści swoją kolejkę.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dealhawk-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
          DEALHAWK_PETLA_MINUT: "8"
        run: python tracker.py

      # always() — gdy bieg padnie albo dobije do limitu czasu, to co zdążył
      # zobaczyć i tak musi trafić do repo, żeby nie wysłać tego drugi raz
      - name: Zapisz seen.json
        if: always()
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          for p in seen.json history.jsonl market.jsonl parser_health.json feed_stan.json telegram_offset.json blackbox; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "update seen.json"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
