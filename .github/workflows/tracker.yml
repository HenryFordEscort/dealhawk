name: DealHawk

# Cron GitHuba NIE dowozi minut: przy ustawieniu "*/5" zmierzone odstępy to
# mediana 5 min, ale co dziesiąty raz 15 min, a rekord to 55. Dlatego bieg
# nie jest pojedynczym skanem, tylko żyje 35 minut i sam skanuje kanał
# co minutę. Cron odpala go co 30 min, więc kolejny bieg startuje ZANIM
# poprzedni umrze — kanał nigdy nie zostaje bez opieki.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: dealhawk-tracker
  # nakładka biegów jest celowa, ale trwać ma sekundy — nowy bieg przejmuje
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEALHAWK_PETLA_MINUT: "35"
          DEALHAWK_ODSTEP_S: "60"
        run: python tracker.py

      # always() — bieg ginie przez cancel-in-progress albo timeout, a to, co
      # zdążył zobaczyć, i tak musi trafić do repo, żeby nie wysłać drugi raz
      - name: Zapisz seen.json
        if: always()
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          for p in seen.json history.jsonl market.jsonl parser_health.json feed_stan.json telegram_offset.json blackbox; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "update seen.json"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
