name: DealHawk

# Tempo nadaje ŁAŃCUSZEK BIEGÓW, nie harmonogram GitHuba. Powód (zmierzone 23.08
# na 204 biegach): GitHub nie dowozi crona co do minuty — odstęp między skanami
# miał medianę 5,0 min, ale p90 = 10,4 min i maksimum 25 min. Ten ogon szedł
# wprost w czas powiadomienia: wiek ogłoszenia w chwili wykrycia miał medianę
# 4 min i p90 = 14 min.
#
# Zamiast jednego długo żyjącego biegu — ŁAŃCUSZEK krótkich ogniw (matrix
# z max-parallel: 1). Każde ogniwo dostaje własny runner, czyli własny adres
# IP, i robi 2-3 żądania. To jest sedno: dławienie Kleinanzeigen jest PER ADRES
# (zmierzone 23.08 — produkcja z 3 żądaniami na bieg nie oberwała ani razu,
# a jeden adres po ~50 żądaniach dostał stronę-śmieć i nie wyszedł z niej
# przez 20 minut mimo zwolnienia do 1 żądania na minutę). Łańcuszek daje więc
# skan co ~40-60 s przy MNIEJSZYM obciążeniu pojedynczego adresu niż dziś.
#
# fail-fast: false — jedno przewrócone ogniwo nie może zerwać reszty nocy.
# Ile ogniw naprawdę zeskanuje, decyduje brama w tracker.py (tempo adaptacyjne):
# gdy serwis dławi, ogniwa kończą bez ani jednego żądania.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dealhawk-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1          # ogniwa po kolei — nigdy dwa naraz na tej samej gałęzi
      matrix:
        ogniwo: [1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
        run: python tracker.py

      # BestDealHawk — drugi kanał, tylko najlepsze oferty. Osobny krok,
      # osobny proces, i to jest cała ochrona DealHawka: ten moduł czyta
      # WYŁĄCZNIE pliki zapisane wyżej i nie dokłada ani jednego żądania do
      # Kleinanzeigen. Nie może więc zmienić ani tego, co bot widzi, ani
      # tempa, ani niczego w seen.json.
      #
      # continue-on-error: rowery są ważniejsze niż kanał najlepszych. Gdyby
      # ten krok padł, ogniwo łańcuszka ma iść dalej i zdążyć zacommitować
      # seen.json — inaczej te same rowery poszłyby drugi raz.
      #
      # if: always() — krok ma się wykonać także wtedy, gdy tracker skończył
      # błędem. Powiadomienia poszły już z jego wnętrza, a oferty zapisane
      # przed wywrotką nadal zasługują na ocenę.
      #
      # Bez sekretu TELEGRAM_BEST_CHAT_ID moduł milczy i kończy się zerem,
      # więc dopisanie tego kroku NIE włącza niczego samo z siebie.
      - name: Kanał najlepszych ofert
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BEST_CHAT_ID: ${{ secrets.TELEGRAM_BEST_CHAT_ID }}
          # Opcjonalny. Gdy pusty, kanal najlepszych pisze botem DealHawka.
          TELEGRAM_BEST_BOT_TOKEN: ${{ secrets.TELEGRAM_BEST_BOT_TOKEN }}
        run: python najlepsze.py

      # always() — gdy bieg padnie albo dobije do limitu czasu, to co zdążył
      # zobaczyć i tak musi trafić do repo, żeby nie wysłać tego drugi raz
      - name: Zapisz seen.json
        if: always()
        env:
          # DZIENNIK GITA, bo przez cały 18.09 nie wypisał ANI SŁOWA.
          # Zmierzone na biegu 35388166881: obie próby giną po limicie 25 s,
          # a własne przerwanie martwego transferu (`lowSpeedTime` 15 s) NIE
          # ODPALA SIĘ. Skoro krótszy hamulec nie zadziałał, git nie stoi na
          # wolnym transferze - zawiesza się, ZANIM cokolwiek popłynie.
          # Bez dziennika nie ma jak dalej zgadywać, a zgadywanie kosztowało
          # już cały dzień.
          #
          # CELOWO BEZ `GIT_CURL_VERBOSE`. To repo jest PUBLICZNE, a tamta
          # zmienna wypisuje nagłówki HTTP razem z `Authorization`, czyli
          # token do zapisu. `GIT_TRACE` pokazuje same wołane polecenia
          # i czasy - tyle wystarczy, żeby zobaczyć, na czym staje.
          GIT_TRACE: "1"
          GIT_TRACE_PERFORMANCE: "1"
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          # UDERZENIE W SAMO ZAWIESZENIE, nie w jego skutki (18.09.2026).
          # Zmierzone na biegu 35385837336: KAŻDA próba pushu ginie równo po
          # 25 s, czyli po limicie - nie wraca błędem, tylko wisi. A gdy
          # przejdzie, robi wszystko w 3 SEKUNDY. Nie ma stanów pośrednich,
          # więc to nie jest "wolno" - to jest "stanęło".
          #
          # HTTP/1.1: git domyślnie gada z GitHubem po HTTP/2, a to połączenie
          # potrafi stanąć w martwym punkcie bez żadnego sygnału po obu
          # stronach. Wymuszenie starszej wersji protokołu jest znanym
          # obejściem dokładnie tego objawu i nic nie kosztuje przy commicie
          # ważącym dwie linijki.
          #
          # lowSpeedLimit/Time: git SAM przerywa transfer, który przez 15 s
          # nie dowiózł nawet kilobajta, i wraca BŁĘDEM. Bez tego jedynym
          # hamulcem jest `timeout` z zewnątrz, który nie wie, czy git pracuje,
          # czy stoi - a błąd od gita idzie do logu z powodem.
          # http.postBuffer: DealHawk pcha w KAŻDYM commicie seen.json (24,6 MB)
          # i market.jsonl (27,5 MB). Git ma bufor wysyłki domyślnie na 1 MB - gdy
          # paczka się w nim mieści, leci jednym strzałem, a gdy nie, git przełącza
          # się na wysyłkę porcjami i TA droga się zawiesza.
          # 
          # To jedyna hipoteza z 18.09, która tłumaczy WSZYSTKIE pomiary naraz:
          # zawieszenie PRZED przepływem danych, brak reakcji lowSpeedTime (nic nie
          # płynie, więc nie ma czego mierzyć) oraz trzysekundowe sukcesy - gdy
          # zmiana spakuje się poniżej megabajta, idzie starą drogą i przechodzi
          # od razu. Wcześniejsze teorie (rozmiar repo, HTTP/2, uprawnienia) nie
          # umiały wyjaśnić tej przeplatanki.
          git config --local http.postBuffer 524288000
          git config --local http.version HTTP/1.1
          git config --local http.lowSpeedLimit 1000
          git config --local http.lowSpeedTime 15
          # KAWAŁKI DZIENNIKA RYNKU MUSZĄ BYĆ NA TEJ LIŚCIE. Od 18.09.2026
          # bot dopisuje do `market-RRRR-MM.jsonl`, a nie do `market.jsonl`.
          # Bez wzorca nowy miesiąc wypadłby z commita po cichu i dziennik
          # urwałby się pierwszego dnia miesiąca - dokładnie ta klasa cichej
          # awarii, przed którą ostrzega zapis o `blackbox` w regułach.
          for p in seen.json history.jsonl market.jsonl market-*.jsonl parser_health.json feed_stan.json telegram_offset.json transakcje.jsonl best_wyslane.json odrzuty.jsonl best_offset.json blackbox; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "update seen.json"
          # LIMIT CZASU NA GITA (18.09.2026). Zmierzone tego dnia: `git pull
          # --rebase` nie wypisał ANI JEDNEJ LINIJKI przez 11 min 53 s, aż
          # runner dostał SIGTERM (kod 143). Ogniwo zżarło 13 minut zamiast
          # półtorej, a grupa `concurrency` trzymała przez ten czas kolejkę -
          # więc szturchnięcia co 5 minut kasowały się nawzajem i bot robił
          # jeden skan na kwadrans zamiast siedmiu na pięć minut.
          #
          # RACHUNEK MUSI SIĘ ZMIEŚCIĆ W `timeout-minutes: 8` (480 s), inaczej
          # ta poprawka nic nie daje - krok i tak zostanie ucięty w połowie.
          # Przeliczany DWA RAZY tego dnia, za każdym razem na świeższym
          # pomiarze, i to jest jego historia:
          #   90 s x 3 proby = 550 s  -> łamało własny sufit
          #   45 s x 3 proby = 280 s  -> mieściło się przy skanie 60-70 s
          #   25 s x 2 proby = 125 s  -> mieści się przy skanie 5 MINUT
          #
          # Skok wziął się z pomiaru na biegu 35364858243: krok "Uruchom
          # tracker" trwał tam 302, 309, 313 i 323 s na ogniwach 2-5, a nie
          # 100 s jak na ogniwie 1. Na taki skan zostaje ze sufitu ~150 s
          # i tyle wolno wydać na zapis.
          #
          # 25 s to ośmiokrotność ZDROWEGO pusha: udany zapis na ogniwie 1
          # (pobranie, rebase i push) zajął 3 SEKUNDY. Git tu nie jest wolny,
          # tylko zawiesza się albo przechodzi od razu.
          #
          # `-k 5` DOBIJA zawieszonego gita. Bez tego zostaje sierotą: log
          # ogniwa 2 kończy się sześcioma wpisami "Terminate orphan process:
          # git", czyli samo SIGTERM z `timeout` go nie ruszyło.
          for i in 1 2; do
            if timeout -k 5 25 git pull --rebase && timeout -k 5 25 git push; then
              echo "seen.json zapisany (próba $i)"
              exit 0
            fi
            echo "próba $i nie wyszła"
            sleep 5
          done
          # CZERWONO, NIE PO CICHU. Niezapisany stan znaczy, że następne
          # ogniwo zobaczy te same rowery - a to albo powtórka na Telegramie,
          # albo zmarnowany skan. `fail-fast: false` wyżej pilnuje, żeby ten
          # czerwony kolor nie zerwał pozostałych sześciu ogniw.
          echo "::error::Nie udało się zapisać seen.json - git zawisł na obu próbach"
          exit 1
