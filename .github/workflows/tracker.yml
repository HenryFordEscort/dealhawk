name: DealHawk

# Tempo nadaje ŁAŃCUSZEK BIEGÓW, nie harmonogram GitHuba. Powód (zmierzone 23.08
# na 204 biegach): GitHub nie dowozi crona co do minuty — odstęp między skanami
# miał medianę 5,0 min, ale p90 = 10,4 min i maksimum 25 min. Ten ogon szedł
# wprost w czas powiadomienia: wiek ogłoszenia w chwili wykrycia miał medianę
# 4 min i p90 = 14 min.
#
# Zamiast jednego długo żyjącego biegu — ŁAŃCUSZEK krótkich ogniw (matrix
# z max-parallel: 1). Każde ogniwo dostaje własny runner, czyli własny adres
# IP, i robi 2-3 żądania. To jest sedno: dławienie Kleinanzeigen jest PER ADRES
# (zmierzone 23.08 — produkcja z 3 żądaniami na bieg nie oberwała ani razu,
# a jeden adres po ~50 żądaniach dostał stronę-śmieć i nie wyszedł z niej
# przez 20 minut mimo zwolnienia do 1 żądania na minutę). Łańcuszek daje więc
# skan co ~40-60 s przy MNIEJSZYM obciążeniu pojedynczego adresu niż dziś.
#
# fail-fast: false — jedno przewrócone ogniwo nie może zerwać reszty nocy.
# Ile ogniw naprawdę zeskanuje, decyduje brama w tracker.py (tempo adaptacyjne):
# gdy serwis dławi, ogniwa kończą bez ani jednego żądania.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dealhawk-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1          # ogniwa po kolei — nigdy dwa naraz na tej samej gałęzi
      matrix:
        ogniwo: [1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
        run: python tracker.py

      # BestDealHawk — drugi kanał, tylko najlepsze oferty. Osobny krok,
      # osobny proces, i to jest cała ochrona DealHawka: ten moduł czyta
      # WYŁĄCZNIE pliki zapisane wyżej i nie dokłada ani jednego żądania do
      # Kleinanzeigen. Nie może więc zmienić ani tego, co bot widzi, ani
      # tempa, ani niczego w seen.json.
      #
      # continue-on-error: rowery są ważniejsze niż kanał najlepszych. Gdyby
      # ten krok padł, ogniwo łańcuszka ma iść dalej i zdążyć zacommitować
      # seen.json — inaczej te same rowery poszłyby drugi raz.
      #
      # if: always() — krok ma się wykonać także wtedy, gdy tracker skończył
      # błędem. Powiadomienia poszły już z jego wnętrza, a oferty zapisane
      # przed wywrotką nadal zasługują na ocenę.
      #
      # Bez sekretu TELEGRAM_BEST_CHAT_ID moduł milczy i kończy się zerem,
      # więc dopisanie tego kroku NIE włącza niczego samo z siebie.
      - name: Kanał najlepszych ofert
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BEST_CHAT_ID: ${{ secrets.TELEGRAM_BEST_CHAT_ID }}
        run: python najlepsze.py

      # always() — gdy bieg padnie albo dobije do limitu czasu, to co zdążył
      # zobaczyć i tak musi trafić do repo, żeby nie wysłać tego drugi raz
      - name: Zapisz seen.json
        if: always()
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          for p in seen.json history.jsonl market.jsonl parser_health.json feed_stan.json telegram_offset.json transakcje.jsonl best_wyslane.json blackbox; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "update seen.json"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
