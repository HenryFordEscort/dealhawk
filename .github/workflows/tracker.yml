name: DealHawk

# Tempo nadaje zewnętrzny wyzwalacz (workflow_dispatch co 5 minut) — cron
# poniżej jest tylko siatką bezpieczeństwa, gdyby tamten stanął. Skrypt umie
# też chodzić w pętli w jednym biegu (DEALHAWK_PETLA_MINUT), ale przy wyzwalaczu
# co 5 minut nie ma to sensu: każde wyzwolenie ubijałoby trwającą pętlę.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dealhawk-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tracker.py

      # always() — gdy bieg padnie albo dobije do limitu czasu, to co zdążył
      # zobaczyć i tak musi trafić do repo, żeby nie wysłać tego drugi raz
      - name: Zapisz seen.json
        if: always()
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          for p in seen.json history.jsonl market.jsonl parser_health.json feed_stan.json telegram_offset.json blackbox; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "update seen.json"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
