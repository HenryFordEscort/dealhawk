name: Testy

on:
  # LISTA JEST ODWROTNA Z ROZMYSLU (20.09.2026). Do tego dnia stala tu
  # RECZNA lista plikow, ktore budza testy - a wiec kazdy NOWY plik nie budzil
  # niczego, dopoki ktos o nim nie pamietal. Pamiec zawiodla juz dwa razy przy
  # liscie czytnikow kawalkow (18. i 19.09), wiec tutaj domyslnie testujemy
  # WSZYSTKO, a wymieniamy tylko to, czego testowac nie ma sensu: pliki,
  # ktore boty zapisuja same co kilka minut. Nowy modul jest chroniony od
  # pierwszej sekundy, bez dopisywania go gdziekolwiek.
  #
  # Wyciagniete z `git add` we WSZYSTKICH zadaniach: tracker.yml, dozorca.yml,
  # otomoto.yml, summary.yml i diagnoza.yml.
  push:
    paths-ignore: &stan_botow
      - "seen.json"
      - "seen-*.json"
      - "seen_*.json"
      - "history.jsonl"
      - "market.jsonl"
      - "market-*.jsonl"
      - "rynek_pl.jsonl"
      - "transakcje.jsonl"
      - "odrzuty.jsonl"
      - "odrzuty_auta.jsonl"
      - "parser_health.json"
      - "feed_stan.json"
      - "telegram_offset.json"
      - "best_offset.json"
      - "best_wyslane.json"
      - "olx_stan.json"
      - "olx_watch.json"
      - "olx_details.json"
      - "de_stan.json"
      - "otomoto_stan.json"
      - "dozorca_zdrowie.json"
      - "pinned_summary.json"
      - "cennik_cech.json"
      - "zdarzenia/**"
      - "zdarzenia_de/**"
      - "blackbox/**"
      - "diagnoza/**"
  # PULL REQUEST JEST TU NAJWAZNIEJSZY. Zmiana przyslana z innej sesji ma
  # dostac czerwone swiatlo ZANIM trafi do dzialajacej wersji - inaczej
  # jedyna obrona jest to, czy jej autor sam pamietal o uruchomieniu testow.
  pull_request:
    paths-ignore: *stan_botow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # BEZ `ref: main` (20.09.2026). Do tego dnia stalo tu `ref: main`, wiec
      # testy pobieraly WERSJE, KTORA JUZ DZIALA, i wykonywaly sie na niej
      # niezaleznie od tego, co ktos przyslal. Wychodzily zielone zawsze.
      # Jedyna realna obrona byla dyscyplina autora zmiany - a obca sesja
      # jej nie ma. Domyslny checkout bierze ten ref, ktory wywolal bieg.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom testy regresyjne (bot rowerowy)
        run: python test.py

      - name: Uruchom testy regresyjne (bot samochodowy)
        run: python test_otomoto.py

      # DO 20.09.2026 TEN ZESTAW NIE URUCHAMIAL SIE W OGOLE - 125 sprawdzen
      # kanalu najlepszych lezalo w repo i nie bylo wolane przez nikogo.
      - name: Uruchom testy regresyjne (kanał najlepszych)
        run: python test_najlepsze.py

      # PROBA NA SUCHO (20.09.2026). Trzy zestawy wyzej pytaja, czy funkcje
      # robia to, co wpisal autor testu. Ten krok pyta o co innego: ILE
      # ROWEROW przeszloby bramki, gdyby przyslany kod chodzil przez te same
      # dwa tygodnie rynku. Lapie wiec zepsucie NIEZALEZNIE od tego, ktora
      # linijke ktos ruszyl - i dlatego stoi na koncu, jako ostatnie slowo.
      #
      # Okno jest ZAMROZONE, wiec prog wynosi ZERO: wejscie sie nie zmienia,
      # kazda roznica pochodzi z kodu. Swiadoma zmiana = `--zapisz` i nowy
      # `wzorzec_zachowania.json` w tym samym commicie, gdzie w diffie widac
      # jej koszt.
      - name: Próba na sucho (odcisk zachowania na rynku)
        env:
          TELEGRAM_BOT_TOKEN: atrapa
          TELEGRAM_CHAT_ID: "0"
        run: python sprawdz_zachowanie.py
