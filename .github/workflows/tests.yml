name: Testy

on:
  push:
    paths:
      - "tracker.py"
      - "summary.py"
      - "test.py"
      - "dozorca.py"
      - "zbieraj_rynek.py"
      # olx.py to wspólny klient OBU botów — zmiana tu bez testów była
      # dokładnie tą drogą, którą parser czytał 38% rynku przez wiele tygodni
      - "olx.py"
      - "zycie_ofert.py"
      # /rozmiar czyta seen.json i decyduje, KTÓRE rowery właściciel
      # w ogóle zobaczy w przeglądzie - test.py to pokrywa
      - "rozmiary.py"
      # `/oferta` układa tekst, który właściciel wysyła obcemu człowiekowi pod
      # WŁASNYM nazwiskiem - błąd tutaj to nie zła lista na ekranie, tylko zła
      # kwota albo nieprawdziwe zdanie o sprzedawcy w wysłanej wiadomości
      - "oferta.py"
      - "wiedza_sprzet.json"
      # lista rodzin Boschowych jest WIEDZA, na ktorej stoi filtr silnika -
      # zla linia tutaj przepuszcza obcy naped rownie skutecznie jak blad w kodzie
      - "silniki_bosch.json"
      - "sprawdz_silniki.py"
      - "otomoto_tracker.py"
      - "test_otomoto.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Uruchom testy regresyjne (bot rowerowy)
        run: python test.py

      - name: Uruchom testy regresyjne (bot samochodowy)
        run: python test_otomoto.py
