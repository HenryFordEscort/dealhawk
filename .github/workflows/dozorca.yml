name: Dozorca OLX

# TEMPO NADAJE ŁAŃCUSZEK BIEGÓW, NIE HARMONOGRAM GITHUBA (11.11.2026).
#
# Co 2 godziny zamiast raz na dobę — to 12x lepsza rozdzielczość pomiaru
# "ile dni wisiała oferta". Przy dobowym próbkowaniu "sprzedane w 1 dzień"
# było nieodróżnialne od "zniknęło po godzinie".
#
# Tylko że cron tych dwóch godzin NIE DOWOZIŁ. Zmierzone 11.11.2026 na 300
# biegach z 70 dni (API Actions; wszystkie `success`, 299 z crona): mediana
# odstępu między biegami 5,6 h, p90 7,8 h, maksimum 10,9 h, a odstępów
# krótszych niż 2,5 h były 3 na 299. Czyli mediana 4 biegi na dobę zamiast
# 12 (min 3, max 6 na ostatnich 21 dniach). To nie usterka tego repo: od
# 27.08.2026 oberwały wszystkie harmonogramy (patrz nagłówek `otomoto.yml`),
# a DealHawk przeżył tylko dzięki zewnętrznemu workflow_dispatch co 5 minut.
#
# Dlatego każdy bieg czeka do pełnych dwóch godzin od swojego startu i sam
# wyzwala następny (ostatni krok). Cron zostaje SIATKĄ BEZPIECZEŃSTWA: gdy
# łańcuszek się zerwie — anulowany bieg albo wyłącznik właściciela — pierwszy
# dowieziony bieg z crona zaczyna go od nowa.
#
# Dwóch łańcuszków naraz nie będzie i to grupa `dealhawk-dozorca` tego
# pilnuje: trzyma jeden bieg w toku, a bieg czekający dwie godziny trzyma ją
# całe te dwie godziny. Grupa jest tu więc OGRANICZNIKIEM TEMPA, nie tylko
# zabezpieczeniem - nawet gdyby cron dowiózł swoje biegi co do jednego,
# dozorca i tak pyta najwyżej raz na dwie godziny.
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

concurrency:
  group: dealhawk-dozorca
  cancel-in-progress: false

jobs:
  obserwuj:
    runs-on: ubuntu-latest
    # Dwie godziny czekania łańcuszka plus ~5 minut pracy. Sufit 150 minut
    # zamiast domyślnych 360: zawieszony bieg trzyma grupę `dealhawk-dozorca`,
    # a ta grupa jest tu ogranicznikiem tempa - sześć godzin wiszenia to sześć
    # godzin bez dozorcy. Zapas nad 125 minutami jest po to, żeby zwykłe
    # opóźnienie pracy nie ucięło kroku wyzwalającego.
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write          # wyzwolenie następnego biegu

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # START anchorem jest POCZĄTEK biegu, nie koniec pracy. Inaczej odstęp
      # byłby "2 h od zakończenia", czyli rósłby razem z czasem pracy.
      - name: Zapamiętaj start biegu
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      - name: Obserwuj rynek OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
        run: python dozorca.py 30

      # DOZORCA NIEMIECKI. Napisany 29.08.2026, przetestowany, i NIGDY NIE
      # URUCHAMIANY - `zdarzenia_de/` stanęło na 76 zdarzeniach z sierpnia,
      # a `de_stan.json` na 28.08. Skutek zmierzony 13.09: komenda /dojrzale
      # pokazywała listę, z której 7 na 8 ogłoszeń było już zdjętych, bo nikt
      # nie sprawdzał, czy żyją. Właściciel: "to aktualnie jest bezuzyteczne,
      # tylko jedna to bylo istniejace ogloszenie, reszta usuniete".
      #
      # LIMIT 40, PODNIESIONY Z 25 (11.11.2026). Dwadzieścia pięć stało na
      # pomiarze z laptopa i z cloudscraperem ("~22 zapytania w kilka minut
      # i Kleinanzeigen oddaje strony bez znaczników kontaktu"), a produkcja
      # chodzi z innego adresu i lżejszym klientem. Zmierzone na dzienniku
      # `zdarzenia_de/`: przy 25-26 sprawdzeniach na przebieg nieczytelnych
      # jest 0,3-0,5%, a 113 przebiegów zrobiło 27-31 sprawdzeń bez ani
      # jednego. Krzywa po pozycji w przebiegu nie rośnie, czyli podpisu
      # dławienia tam nie ma. Powyżej ~31 nie ma żadnego pomiaru, więc 40 to
      # KROK, nie koniec - pilnuje go `dozorca_de.czy_dlawi`, która rozpoznaje
      # dławienie po nieczytelnym OGONIE przebiegu. Liczba musi zgadzać się
      # z `dozorca_de.LIMIT_PRODUKCYJNY` i pilnuje tego test.
      #
      # continue-on-error: dozorca to DIAGNOSTYKA. Jego awaria nie ma prawa
      # zerwać obserwacji OLX, która leci krok wyżej.
      - name: Obserwuj rynek Kleinanzeigen
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dozorca_de.py 40

      # SPIS RYNKU - raz na dobe, ale probowany przy KAZDYM przebiegu.
      # `spisz()` pomija wycinki, ktore maja juz pomiar z tego dnia, wiec
      # powtorka nie dubluje danych, a domyka te, ktore ranem padly. Tak trzeba,
      # bo cron GitHuba spoznia sie nieregularnie (zmierzone 15.09.2026 na
      # Otomoto: mediana 3,6 h, p90 5,7 h). Bez tego dziennik trendu mialby
      # dziury dokladnie tam, gdzie GitHub mial zly dzien.
      #
      # continue-on-error: spis to POMIAR, nie obserwacja. Jego awaria nie ma
      # prawa zerwac dozorcy, ktory pilnuje konkretnych ofert.
      - name: Spisz rynek OLX
        continue-on-error: true
        env:
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
        run: python spis_rynku.py

      # PRZEPLYW POLKI - cala kategoria 8k+ co do jednego ogloszenia (~3750
      # sztuk, ~100 zapytan, ~2 minuty). Raz na dobe: to jedyny pomiar z PELNA
      # i STALA rama, wiec z niego wychodzi naplyw i odplyw rynku. Dozorca
      # mierzy przeplyw tylko na 41 zapytaniach modelowych i jego rama zmienia
      # sie, ilekroc dopisze sie model - dlatego jego szereg nie sluzy do trendu.
      - name: Przejdz polke 8k+
        continue-on-error: true
        env:
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
        run: python przeplyw.py --raz-na-dobe

      # ZAPIS WISIAL 30-40 MINUT PRZY ZDROWYCH 2 SEKUNDACH (naprawione
      # 23.10.2026). DealHawk dostal te poprawke 18.09, OtomotoHawk 26.09,
      # a dozorca chodzil bez niej jeszcze cztery tygodnie - bo u niego nic
      # nie bolalo: biegi konczyly sie sukcesem, dane sie zapisywaly, a sufit
      # czasu zadania jest luzny. Zmierzone na 100 jego commitach z okna
      # 27.09-22.10.2026 (metoda: roznica miedzy data commitu a data po
      # rebasie): mediana 27 min 13 s, najkrotszy 13 min 12 s, najdluzszy
      # 57 min 19 s, **ponizej 10 minut ZERO na 100**.
      #
      # Powod jest ten sam co tam: `actions/checkout` robi klon PLYTKI, na
      # jeden commit, a gole `git pull --rebase` prosi wtedy o historie,
      # ktorej ten klon nie ma - wiec serwer dosyla CALE repozytorium
      # i `git index-pack` miele je bez konca. Odtworzone na replice runnera
      # (klon `--depth=1`, 30 commitow za main): patrz CLAUDE.md, rozdzial
      # "Wiszacy zapis u dozorcy".
      #
      # RACHUNEK: `3 x 3 x (15 + 5) + 2 x 5 = 190 s`. Zadanie ma od 11.11.2026
      # sufit 150 minut (2 h czekania lancuszka + praca), wiec 190 s miesci
      # sie z ogromnym zapasem - a czekanie lancuszka jest PO tym kroku, wiec
      # zapis nigdy nie konkuruje o czas z czekaniem. 15 s to siedmiokrotnosc ZDROWEGO zapisu (2 s
      # zmierzone u DealHawka i u Otomoto po naprawie) - git tu albo
      # przechodzi od razu, albo wisi bez konca, a wiszacemu dluzszy limit
      # nie pomoze. `-k 5` DOBIJA zawieszonego gita: samo SIGTERM go nie
      # rusza, zostaje sierota (zmierzone 18.09 na logu ogniwa DealHawka).
      - name: Zapisz dziennik zdarzeń
        run: |
          git config user.name "DealHawk Bot"
          git config user.email "bot@dealhawk"
          for p in zdarzenia zdarzenia_de olx_stan.json de_stan.json dozorca_zdrowie.json spis_rynku.jsonl polka_stan.json polka_zdarzenia.jsonl; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "dozorca: zdarzenia OLX"
          # `--depth=1 origin main` ogranicza pobor do samego wierzcholka, wiec
          # paczka jest mala Z KONSTRUKCJI. SAMO `pull --rebase --depth=1` to
          # pulapka, sprawdzona i odrzucona 18.09: po plytkim poborze nie ma
          # wspolnego przodka, wiec git ODWRACA ROLE i przeklada commity
          # main-a na nasz. Dlatego jawnie `--onto FETCH_HEAD "$BAZA"`: NASZE
          # commity na swiezy wierzcholek, z baza w punkcie, z ktorego wyszedl
          # checkout. BAZA czytana na POCZATKU KAZDEJ PROBY, przed jej
          # poborem - po udanym rebasie `origin/main` wskazuje juz nasz
          # wierzcholek, a po nieudanym poborze nie rusza sie wcale.
          for i in 1 2 3; do
            BAZA=$(git rev-parse refs/remotes/origin/main) || exit 1
            if timeout -k 5 15 git fetch --depth=1 origin main \
               && timeout -k 5 15 git rebase --onto FETCH_HEAD "$BAZA" \
               && timeout -k 5 15 git push origin HEAD:main; then
              echo "dziennik zdarzeń zapisany (próba $i)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "próba $i nie wyszła"
            sleep 5
          done
          # CZERWONO, NIE PO CICHU. Stara petla po trzech nieudanych probach
          # po prostu sie konczyla, a krok wychodzil ZEREM - wiec utrata
          # dziennika wygladala dokladnie tak samo jak udany zapis. A tutaj
          # utrata znaczy, ze zdarzenia z tego biegu PRZEPADAJA: dozorca jest
          # jedynym zrodlem wiedzy o tym, ktore ogloszenia jeszcze zyja i po
          # ilu dniach schodza, a nastepny bieg zobaczy stan sprzed i nie ma
          # skad odtworzyc tego, czego nie zapisal.
          #
          # Czerwony krok NIE ZRYWA LANCUSZKA, ale od 11.11.2026 trzyma sie to
          # na warunku, nie na tym, ze nie ma czego zrywac: krok wyzwalajacy
          # nastepny bieg stoi pod `!cancelled()`, a to jest prawda takze po
          # `exit 1`. Do 11.11 stalo tu zdanie "ten workflow nie wyzwala
          # zadnego nastepnego biegu" - przestalo byc prawdziwe w commicie,
          # ktory dodal lancuszek, i dlatego pilnuje tego test.
          echo "::error::Nie udało się zapisać dziennika zdarzeń - pobór, rebase albo push nie przeszedł na żadnej z trzech prób. Zdarzenia z tego biegu przepadły."
          exit 1

      # ŁAŃCUSZEK. Wzorzec przeniesiony z `otomoto.yml`, gdzie chodzi od
      # 15.09.2026 i dowozi swoje 48 biegów na dobę przy tym samym cronie,
      # który dozorcy dawał 4 na 12.
      #
      # `!cancelled()`, a nie `always()`: wywrotka obserwacji ani czerwony
      # zapis dziennika nie mogą zerwać łańcuszka, ale RĘCZNE anulowanie biegu
      # ma go zatrzymać - inaczej nie da się go zatrzymać wcale. Zapasowy
      # START chroni przed pętlą bez przerwy: pusty dawałby ujemne czekanie,
      # czyli bieg za biegiem co kilka minut i zdławiony Kleinanzeigen.
      #
      # WYŁĄCZNIK JEST PO STRONIE WŁAŚCICIELA, tak samo jak przy zapasie
      # półki DE. Zmienna repozytorium `DOZORCA_LANCUSZEK` o wartości `0`
      # (Settings → Variables) zatrzymuje łańcuszek bez dotykania kodu i bez
      # zatrzymywania dozorcy: zostaje cron, czyli zmierzone ~4 biegi na dobę.
      # Zdjęcie zmiennej wraca do dwunastu - pierwszy bieg z crona zaczyna
      # łańcuszek od nowa, więc włączenie też nie wymaga niczyjej ręki.
      #
      # Czego ten krok NIE pilnuje: czy Kleinanzeigen zniesie trzy razy
      # częstsze pytania. Zmierzone przed wdrożeniem na dzienniku (161
      # przebiegów, X-XI): 18 przebiegów z odstępem krótszym niż 4 h zrobiło
      # 480 sprawdzeń z ZEREM nieczytelnych stron, a wszystkie 16
      # nieczytelnych siedzi w przebiegach z odstępem 4 h i większym. Czyli
      # w zmierzonym zakresie odstęp nie przewiduje dławienia - ale dwie
      # godziny na sztywno to dla tego zbioru nowy punkt. Pilnuje go
      # `dozorca_de.czy_dlawi`, a jego werdykt idzie od dziś do dziennika
      # przebiegów (`zdarzenia_de/przebiegi-RRRR-MM.jsonl`, pole `dlawi`)
      # i do raportu `/plynnosc`. Jeśli tam zacznie rosnąć, wyłącznikiem
      # jest jedna zmienna.
      #
      # `format('{0}', ...)` NIE JEST OZDOBĄ. Pierwsza wersja miała
      # `vars.DOZORCA_LANCUSZEK != '0'` i krok wyszedł `skipped` przy
      # NIEUSTAWIONEJ zmiennej - zmierzone na biegu 43080486588 (praca
      # wykonana, 40 sprawdzeń, krok 11 pominięty). Powód: przy różnych
      # typach GitHub rzutuje obie strony NA LICZBĘ, a `null` i `'0'` dają
      # wtedy to samo zero - czyli wyłącznik był włączony z fabryki
      # i łańcuszek nie zacząłby się nigdy. `format` wymusza napis, a dwa
      # napisy porównują się jako napisy.
      - name: Wyzwól następny bieg po dwóch godzinach
        if: ${{ !cancelled() && format('{0}', vars.DOZORCA_LANCUSZEK) != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          START="${START:-$(date +%s)}"
          zostalo=$(( START + 2 * 60 * 60 - $(date +%s) ))
          if [ "$zostalo" -gt 0 ]; then sleep "$zostalo"; fi
          gh workflow run dozorca.yml --ref main --repo "$GITHUB_REPOSITORY"
