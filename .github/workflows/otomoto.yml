name: OtomotoHawk

# Tempo nadaje ŁAŃCUSZEK BIEGÓW, nie harmonogram GitHuba. Każdy bieg po skanie
# czeka do pełnych 30 minut od swojego startu i sam wyzwala następny.
#
# Powód, zmierzony 15.09.2026: od 27.08 GitHub dowoził z crona */30 mediana
# jeden bieg co 3,6 h (p90 5,7 h, maksimum 11,4 h), a wcześniej co 39 min.
# Oberwały wszystkie harmonogramy w repo, dozorca też (z 12 biegów na dobę
# do ~5). Bot rowerowy tego nie odczuł, bo wyzwala go zewnętrzny
# workflow_dispatch co 5 minut.
#
# Dlaczego nie spod bota rowerowego: boty mają zostać niezależne, a każda
# zmiana w tracker.yml ryzykuje DealHawka. Ten łańcuszek go nie dotyka.
#
# Cron zostaje jako SIATKA BEZPIECZEŃSTWA: gdy łańcuszek się zerwie, pierwszy
# dowieziony bieg z crona zaczyna go od nowa. Minuty 7 i 37, bo GitHub sam
# radzi omijać pełne godziny, kiedy jego kolejka jest najbardziej zatkana.
# Dwóch łańcuszków naraz nie będzie: grupa `otomoto` trzyma najwyżej jeden
# bieg w toku i jeden czekający, a nowy czekający kasuje starszego.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: otomoto
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # skan trwa ~1 min, reszta to czekanie łańcuszka; zawieszony skan nie może
    # trzymać grupy w nieskończoność
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write          # wyzwolenie następnego biegu

    steps:
      # SPRZĄTACZ ZAKLESZCZONEJ KOLEJKI DEALHAWKA (18.09.2026).
      #
      # Wpadka: 17.09 o 22:39:22 do kolejki `tracker.yml` wszedł bieg, który
      # nigdy nie wystartował i nigdy nie umarł. Grupa `dealhawk-tracker`
      # przepuszcza jeden bieg naraz, więc KAŻDE kolejne szturchnięcie stawało
      # za nim i ginęło skasowane przez następne. Zmierzone: bot robił
      # 63-68 skanów na godzinę do 22:39, a potem 1-3 na godzinę przez
      # 16 GODZIN. Odetkanie ręczne (anulowanie zakleszczonego) natychmiast
      # przepuściło skan.
      #
      # Znalezione zombie: 15.06, 27.08, 13.09 i 18.09 - nikt ich nie sprzątał
      # od trzech miesięcy, bo nic ich nie sprząta.
      #
      # DLACZEGO TUTAJ, A NIE W `tracker.yml`: zakleszczony bieg blokuje
      # WŁASNY workflow, więc sprzątacz w nim nigdy by nie ruszył. Ten
      # łańcuszek chodzi niezależnie co 30 minut i ma już `actions: write`.
      #
      # DLACZEGO NIE `cancel-in-progress: true` u DealHawka: to gubiłoby skany
      # w trakcie, a założenie tego bota jest odwrotne - powiadomienie ma
      # przyjść najszybciej, jak się da. Sprzątacz nie dotyka ani jednego
      # biegu, który pracuje.
      #
      # PRÓG 10 MINUT: zdrowy bieg dostaje runnera w sekundy i kończy się
      # w 2-4 min. Stan `queued` dłuższy niż dwa cykle szturchnięć (5 min)
      # to zakleszczenie, nie zatłoczenie. `pending` NIE RUSZAMY - to normalne
      # czekanie na grupę i rozwiązuje się samo.
      - name: Odetkaj kolejkę DealHawka
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          teraz=$(date +%s)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tracker.yml/runs?status=queued&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at)"' | while read -r id utworzony; do
              wiek=$(( teraz - $(date -d "$utworzony" +%s) ))
              [ "$wiek" -gt 600 ] || continue
              # BIEG, KTÓRY PRACUJE, JEST NIETYKALNY - a sam status biegu tego
              # NIE ROZSTRZYGA. Zmierzone 18.09.2026 na biegu 35363854542:
              # status CAŁEGO biegu to `queued`, a jego `check (1)` był wtedy
              # `in_progress` i normalnie skanował. Tak wygląda KAŻDY zdrowy
              # bieg matrycy - ogniwa 2-7 czekają na swoją kolej przy
              # `max-parallel: 1`, więc bieg raportuje `queued` przez cały
              # swój czas życia.
              #
              # Bez tego warunku sprzątacz kasowałby zdrowe biegi po dziesięciu
              # minutach. Siedem ogniw po ~1,5 min to ~10,5 min, czyli
              # DOKŁADNIE próg - więc gubiłby skany przy każdym przebiegu.
              # Zakleszczenie poznajemy po tym, że nie ruszyło ANI JEDNO ogniwo.
              ruszylo=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.status != "queued")] | length' 2>/dev/null || echo 0)
              if [ "${ruszylo:-0}" -gt 0 ]; then
                echo "bieg $id pracuje ($ruszylo ogniw ruszyło) - nie tykam"
                continue
              fi
              echo "zakleszczony bieg $id stoi $((wiek / 60)) min, zero ogniw ruszyło - zdejmuję"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
            done

      - name: Zapamiętaj start biegu
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install cloudscraper requests

      # CZUJKA NA CISZĘ DEALHAWKA (20.09.2026).
      #
      # Wpadka: 17-18.09 bot stał 16 GODZIN i właściciel dowiedział się o tym
      # dlatego, że SAM zapytał. Przyczyny tamtej awarii są naprawione, ale
      # WYKRYWANIE nie było - jedyną czujką na „bot w ogóle stanął" jest
      # dzienne podsumowanie o 18:00 UTC, więc szesnastogodzinna cisza
      # pokazuje się najwcześniej nazajutrz.
      #
      # DLACZEGO TUTAJ, A NIE W `tracker.yml`: martwy bot nie krzyknie. Ta
      # sama zasada co przy sprzątaczu kolejki wyżej i co „alarm o zerwanej
      # drodze nie może jechać tą drogą" (18.09).
      #
      # DLACZEGO BOTEM SAMOCHODOWYM: 18.09 padł token DealHawka i każda jego
      # wysyłka szła w próżnię przez pół dnia. Alarm wysyłany tamtym tokenem
      # nie miałby jak dojść dokładnie wtedy, gdy jest najbardziej potrzebny.
      #
      # MIERZYMY COMMIT, NIE BIEG: zapis lokalny bez pusha jest w tej
      # konstrukcji ZEREM (runner jest jednorazowy, pamięcią bota jest `main`).
      - name: Sprawdź, czy DealHawk nie zamilkł
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_OTOMOTO }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ostatni=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=seen.json&per_page=1" \
            --jq '.[0].commit.committer.date')
          python czujka_ciszy.py --ostatni "$ostatni"

      - name: Uruchom tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_OTOMOTO }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_RELAY_URL: ${{ secrets.OLX_RELAY_URL }}
          OLX_RELAY_KEY: ${{ secrets.OLX_RELAY_KEY }}
        run: python otomoto_tracker.py

      # always(): bieg bywa ubijany (limit czasu, anulowanie), a to, co bot
      # zdążył zobaczyć i wysłać, musi trafić do repo, żeby nie wysłał tego
      # drugi raz przy następnym przebiegu
      - name: Zapisz seen_otomoto.json
        if: always()
        run: |
          git config user.name "OtomotoHawk Bot"
          git config user.email "bot@otomotohawk"
          for p in seen_otomoto.json seen_olx.json seen_wystawcy.json otomoto_stan.json odrzuty_auta.jsonl cisza_stan.json zycie_wystawcy.jsonl; do git add "$p" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "update seen files"
          # ZAWIESZAŁ SIĘ POBÓR, NIE WYSYŁKA. DealHawk dostał tę poprawkę
          # 18.09.2026, OtomotoHawk jej nie dostał i chodził z gołym
          # `git pull --rebase` jeszcze tydzień.
          #
          # Powód: `actions/checkout` robi klon PŁYTKI, na jeden commit. Gołe
          # `pull --rebase` prosi wtedy o historię, której ten klon nie ma,
          # więc serwer dosyła CAŁE repozytorium, a `git index-pack` miele je
          # bez końca.
          #
          # ZMIERZONE 26.09.2026 na 14 kolejnych biegach, różnicą między datą
          # commitu a datą, którą wpisuje rebase - czyli czasem spędzonym
          # w samym poborze. Wisiało 14 na 14, od 12 min 27 s do 19 min 56 s,
          # mediana 16 min 41 s. Tego samego dnia DealHawk, w tym samym repo
          # i na tej samej minucie, zapisywał się w 1-2 SEKUNDY na wszystkich
          # siedmiu ogniwach biegu 36245103542.
          #
          # WARUNKI OBU POMIARÓW SĄ TAKIE SAME i to jest tu najważniejsze:
          # oba boty pobierają z tej samej odległości, bo checkout i zapis
          # dzieli tu 14 s (bieg 36243701860), a u DealHawka 23 s. Otomoto nie
          # ma więc żadnej starszej kopii do nadrobienia - jedyną różnicą
          # między 16 minutami a 2 sekundami jest ta poprawka.
          #
          # `--depth=1 origin main` ogranicza pobór do samego wierzchołka,
          # więc paczka jest mała z konstrukcji.
          #
          # SAMO `pull --rebase --depth=1` TO PUŁAPKA, sprawdzona i odrzucona
          # 18.09 na replice runnera: po płytkim poborze nie ma wspólnego
          # przodka, więc git odwraca role i przekłada commity MAIN-a na nasz.
          # Dlatego `--onto FETCH_HEAD "$BAZA"`, czyli jawnie: NASZE commity
          # na świeży wierzchołek, z bazą w punkcie, z którego wyszedł checkout.
          #
          # BAZA czytana na POCZĄTKU KAŻDEJ PRÓBY, przed jej poborem. Po
          # udanym rebasie `origin/main` wskazuje już wierzchołek z naszymi
          # commitami, a po nieudanym poborze nie rusza się wcale.
          #
          # LIMIT 15 s, TEN SAM CO U DEALHAWKA I Z TEGO SAMEGO POWODU: zdrowy
          # zapis trwa 1-2 s (pomiar wyżej), a git tu albo przechodzi od razu,
          # albo wisi bez końca - wiszącemu dłuższy limit nie pomoże. Dobranie
          # tu własnej, hojniejszej liczby byłoby progiem wziętym z głowy,
          # a ten jest sprawdzony na produkcji tego repo.
          #
          # RACHUNEK: 3 x 3 x (15 + 5) + 2 x 5 = 190 s. Do tego kroki przed
          # zapisem (22-32 s zmierzone) i czekanie łańcuszka po nim (do 30
          # minut), czyli ~2 030 s przy suficie 2 700 s. Test LICZY oba progi
          # z pliku, więc podniesienie któregokolwiek bez policzenia reszty
          # tam pada.
          #
          # `-k 5` DOBIJA zawieszonego gita. Zmierzone 18.09 u DealHawka: samo
          # SIGTERM z `timeout` go nie ruszyło i log kończył się sześcioma
          # wpisami "Terminate orphan process: git".
          for i in 1 2 3; do
            BAZA=$(git rev-parse refs/remotes/origin/main) || exit 1
            if timeout -k 5 15 git fetch --depth=1 origin main \
               && timeout -k 5 15 git rebase --onto FETCH_HEAD "$BAZA" \
               && timeout -k 5 15 git push origin HEAD:main; then
              echo "stan zapisany (próba $i)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "próba $i nie wyszła"
            sleep 5
          done
          # CZERWONO, NIE PO CICHU. Stara pętla po trzech nieudanych próbach
          # po prostu się kończyła i krok wychodził ZEREM, więc utrata stanu
          # wyglądała dokładnie tak samo jak udany zapis. A utrata stanu znaczy
          # tu, że następny bieg zobaczy te same auta i wyśle je drugi raz -
          # dokładnie ta wpadka, którą DealHawk przerabiał 18.09 („kilka ofert
          # wysłanych po czterdzieści razy").
          #
          # Czerwony krok NIE ZRYWA ŁAŃCUSZKA: krok wyzwalający następny bieg
          # stoi pod `!cancelled()`, a to jest prawdą także po wywrotce.
          # Pilnuje tego osobny test, bo bez tego warunku ta linijka
          # zamieniałaby jedną cichą stratę w zatrzymanie bota.
          echo "::error::Nie udało się zapisać stanu - pobór, rebase albo push nie przeszedł na żadnej z prób. Następny bieg zobaczy te same auta."
          exit 1

      # ŁAŃCUSZEK. !cancelled(), a nie always(): wywrotka skanu nie może zerwać
      # łańcuszka, ale ręczne anulowanie biegu ma go zatrzymać. Zapasowy START
      # chroni przed pętlą bez przerwy: pusty dawałby ujemne czekanie i bieg
      # za biegiem co minutę.
      - name: Wyzwól następny bieg po pół godzinie
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          START="${START:-$(date +%s)}"
          zostalo=$(( START + 30 * 60 - $(date +%s) ))
          if [ "$zostalo" -gt 0 ]; then sleep "$zostalo"; fi
          gh workflow run otomoto.yml --ref main --repo "$GITHUB_REPOSITORY"
